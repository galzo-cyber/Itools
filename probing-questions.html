ranch preparation"],scaffoldPrompt:"If the PC didn't increment immediately during fetch, what would happen if the current instruction takes a long time to execute?",stretchPrompt:"What happens to the PC if the instruction in MDR turns out to be a jump/branch instruction during decode?",commonMisconception:"Thinking the Program Counter increments only after the instruction finishes executing.",bloomsLevel:"Analyze"},{id:"pq3",topic:"Architecture & CPU",probeType:"What If...? Boundary",question:"What would happen inside an embedded system (like an ABS braking unit in a car) if it were designed using general-purpose Von Neumann architecture with dynamic virtual memory instead of a dedicated microcontroller with ROM?",context:"Contrast embedded real-time systems with general-purpose operating systems.",expectedKeywords:["Real-time response","Deterministic timing","Page thrashing delay","Reliability","Firmware in ROM","Safety critical"],scaffoldPrompt:"Can an anti-lock braking system afford to pause for 50 milliseconds to swap a page from a hard drive into RAM?",stretchPrompt:"Explain why embedded systems rarely require an operating system with multi-tasking scheduling.",commonMisconception:"Assuming more complex general-purpose computer features are always better in specialized hardware.",bloomsLevel:"Evaluate"},{id:"pq4",topic:"Architecture & CPU",probeType:"Justify & Defend",question:"Why does Level 1 Cache have a tiny capacity (e.g. 64KB) compared to RAM (e.g. 16GB), if faster memory is always more desirable?",context:"Physical chip design, cost, and electrical propagation distances.",expectedKeywords:["SRAM vs DRAM","Physical distance on die","Signal propagation latency","Silicon real estate","Manufacturing cost","Heat dissipation"],scaffoldPrompt:"Where is L1 cache physically located compared to RAM, and what happens to electricity traveling across longer distances?",stretchPrompt:"Explain how cache hit rate drops and what mathematical formula calculates effective memory access time.",commonMisconception:"Thinking small cache sizes are just cost-cutting by manufacturers rather than fundamental physics limitations.",bloomsLevel:"Analyze"},{id:"pq5",topic:"Memory & Storage",probeType:"Misconception Hunter",question:"A classmate says: 'Virtual memory makes your computer faster because it gives you unlimited free RAM on your hard drive.' How would you correct their understanding?",context:"Differentiate physical memory capacity expansion from speed degradation.",expectedKeywords:["Secondary storage is much slower","Paging / swapping","Disk thrashing","Temporary overflow","Prevents crash, does not accelerate"],scaffoldPrompt:"Is a mechanical hard drive or solid-state drive as fast as the RAM bus? What happens when the OS swaps pages back and forth continuously?",stretchPrompt:"Describe the exact OS condition known as 'thrashing' and what hardware telemetry graph would show it.",commonMisconception:"Believing virtual memory speeds up processing rather than simply preventing out-of-memory crashes.",bloomsLevel:"Evaluate"},{id:"pq6",topic:"Memory & Storage",probeType:"Justify & Defend",question:"Why is ROM non-volatile while RAM is volatile? Why can't a computer manufacturer just make the entire main memory out of ROM or flash memory?",context:"Read/write speed parity, write cycle degradation, and operating system requirements.",expectedKeywords:["ROM cannot be rewritten quickly/dynamically","RAM allows millions of random read/writes per second","Flash write wear","Bootstrapping / BIOS in ROM"],scaffoldPrompt:"Can you change variables and load different apps if memory can only be read and never rewritten dynamically at high speed?",stretchPrompt:"Discuss the architectural differences between NOR flash, NAND flash, and dynamic RAM (DRAM capacitor refresh).",commonMisconception:"Confusing non-volatility with universal suitability for active computation.",bloomsLevel:"Analyze"},{id:"pq7",topic:"Memory & Storage",probeType:"What If...? Boundary",question:"If a drone manufacturer replaces an SSD with a high-capacity mechanical magnetic HDD to save money, what specific physical failures will occur during flight?",context:"Examine secondary storage mechanical properties, moving parts, vibrations, and read-write head tolerances.",expectedKeywords:["Moving parts","Read/write head crash","G-force & vibration","Power consumption","Weight / inertia","Latency"],scaffoldPrompt:"What is inside a hard disk drive spinning at 7200 RPM, and what happens when the drone banks sharply or vibrates?",stretchPrompt:"Compare the MTBF (Mean Time Between Failures) and shock resistance (in Gs) of flash NAND transistors vs spinning platters.",commonMisconception:"Evaluating storage devices solely on gigabytes per pound without considering physical operating environments.",bloomsLevel:"Apply"},{id:"pq8",topic:"Networks & Protocols",probeType:"Mechanism Deep-Dive",question:"When you type 'www.ocr.org.uk' into a browser, how do DNS and IP routing work together so packets reach the correct physical web server?",context:"Domain Name System lookup, IP addressing, and packet routing.",expectedKeywords:["DNS resolver / cache","TLD server","Domain to IP translation","Routers inspect IP destination","Packet switching","Routing table lookup"],scaffoldPrompt:"Do network cables and routers understand human words like 'ocr.org.uk' or numeric IP addresses?",stretchPrompt:"What role does the TCP layer play once the IP address has been resolved by DNS?",commonMisconception:"Thinking web pages are retrieved directly by typing URLs without intermediate numeric IP lookups.",bloomsLevel:"Analyze"},{id:"pq9",topic:"Networks & Protocols",probeType:"Misconception Hunter",question:"A student asserts: 'A MAC address and an IP address do the same thing: they both tell the internet where my laptop is located.' Why is this incorrect?",context:"Physical hardware addressing (Layer 2) vs logical routable network addressing (Layer 3).",expectedKeywords:["MAC is hardware/NIC burnt-in","Physical identifier (does not change with location)","IP is logical / hierarchical","Assigned by network (changes when roaming)","Local delivery vs wide-area routing"],scaffoldPrompt:"If you take your laptop from school to a coffee shop, does its network card change? Does its IP address change?",stretchPrompt:"How does the Address Resolution Protocol (ARP) bridge the gap between an IP address and a physical MAC address on a local switch?",commonMisconception:"Confusing permanent physical hardware identifiers with routable logical network addresses.",bloomsLevel:"Evaluate"},{id:"pq10",topic:"Networks & Protocols",probeType:"Justify & Defend",question:"Why are network protocol models (like TCP/IP) organized into distinct layers rather than one unified software system?",context:"Abstraction, modularity, hardware independence, and interoperability.",expectedKeywords:["Modularity","Interoperability","Abstraction","Layer independence (change WiFi to 5G without changing HTTP)","Specialized debugging"],scaffoldPrompt:"If you change from ethernet to Wi-Fi, do you have to rewrite your web browser or rewrite websites?",stretchPrompt:"Explain which header encapsulation occurs as an HTTP message passes down through Application, Transport, Internet, and Link layers.",commonMisconception:"Viewing protocol layers as sequential steps in time rather than hierarchical layers of abstraction.",bloomsLevel:"Analyze"},{id:"pq11",topic:"Cyber Security",probeType:"Misconception Hunter",question:"A company boss states: 'We have installed an expensive enterprise firewall, so our employees do not need cyber security awareness training.' What major threat vector does this ignore?",context:"Social engineering, phishing, insider threats, and human factor vulnerabilities.",expectedKeywords:["Social engineering","Phishing","Human vulnerability","Malicious attachments opened from inside","Shoulder surfing / pretexting","Firewall only inspects packets"],scaffoldPrompt:"Can a firewall stop an employee from reading their password over the phone to someone claiming to be IT support?",stretchPrompt:"How can a company mathematically measure the reduction in phishing susceptibility after implementing simulated phishing campaigns?",commonMisconception:"Believing technical hardware filters eliminate human and behavioral security vulnerabilities.",bloomsLevel:"Evaluate"},{id:"pq12",topic:"Cyber Security",probeType:"Mechanism Deep-Dive",question:"How does an SQL Injection attack exploit unsanitized user inputs in a login form, and what exact technical measure prevents it?",context:"Input validation, query concatenation, and parameterized queries (prepared statements).",expectedKeywords:["Unsanitized input","SQL syntax injection (e.g. ' OR '1'='1)","Modifies query logic","Parameterized queries / prepared statements","Treats input as pure data, not executable code"],scaffoldPrompt:"What happens if a database engine interprets the user's input as code rather than plain text data?",stretchPrompt:"Explain the difference between input validation (whitelist checking) and input sanitization (escaping characters).",commonMisconception:"Thinking strong passwords protect a website from SQL injection attacks.",bloomsLevel:"Apply"},{id:"pq13",topic:"Cyber Security",probeType:"What If...? Boundary",question:"What is the difference between a Penetration Tester ('White Hat') and an unauthorized hacker, and how does the Computer Misuse Act 1990 differentiate them legally?",context:"Authorization, legal consent, scope of work, and Section 1/3 offences.",expectedKeywords:["Explicit written authorization","Scope of testing","Computer Misuse Act 1990 Section 1 (unauthorised access)","Contractual liability","Ethical reporting vs exploitation"],scaffoldPrompt:"If you find a security hole in your school's grading system and test it without permission, is that legal?",stretchPrompt:"Discuss the legal dilemma faced by vulnerability researchers operating under 'Responsible Disclosure' frameworks.",commonMisconception:"Thinking good intentions or reporting flaws makes unauthorized access legal under UK law.",bloomsLevel:"Evaluate"},{id:"pq14",topic:"System Software",probeType:"Misconception Hunter",question:"A student runs a defragmentation utility on their brand new Solid State Drive (SSD). Why is this not only useless, but actively harmful to the hardware?",context:"Mechanical seek time vs flash wear-leveling and write endurance cycles.",expectedKeywords:["No moving parts / zero seek time","Direct transistor addressing","Unnecessary write cycles","Degrades flash cell lifespan","TRIM command vs defrag"],scaffoldPrompt:"Does an SSD have a mechanical read/write arm that needs to physically move across spinning platters?",stretchPrompt:"Explain how SSD controllers use wear-leveling algorithms and why file fragmentation does not impact access latency.",commonMisconception:"Assuming maintenance tasks for magnetic hard drives apply equally to solid-state storage.",bloomsLevel:"Analyze"},{id:"pq15",topic:"System Software",probeType:"Justify & Defend",question:"How does the Operating System prevent two running programs from crashing into each other or reading each other's private data in RAM?",context:"Memory management, process isolation, virtual address spaces, and access permissions.",expectedKeywords:["Memory allocation / partition","Virtual memory address spaces","Memory protection / segmentation","Privilege levels","Kernel mode vs user mode"],scaffoldPrompt:"What would happen if Spotify could write directly into the memory addresses where Microsoft Word was holding your unsaved essay?",stretchPrompt:"How does a memory leak occur in user space and what does the OS garbage collector or supervisor do when RAM is exhausted?",commonMisconception:"Assuming programs share a single unprotected pool of memory without OS boundary enforcement.",bloomsLevel:"Analyze"},{id:"pq16",topic:"Ethical, Legal & Environmental",probeType:"Justify & Defend",question:"Under the UK Data Protection Act 2018 (UK GDPR), if a student asks a school to delete all disciplinary and attendance logs citing the 'Right to Erasure', must the school comply? Justify your answer.",context:"Legal obligations, public interest vs individual consent, and lawful bases for processing.",expectedKeywords:["Lawful basis for processing","Legal obligation / public task","Right to erasure has exceptions","Safeguarding and statutory education records","Proportionality"],scaffoldPrompt:"Does GDPR give individuals unlimited power to erase official records required by law for public safeguarding?",stretchPrompt:"Contrast the lawful basis of 'Explicit Consent' with 'Public Task' in institutional data collection.",commonMisconception:"Believing GDPR gives individuals absolute rights to delete any institutional record at will.",bloomsLevel:"Evaluate"},{id:"pq17",topic:"Ethical, Legal & Environmental",probeType:"What If...? Boundary",question:"An autonomous delivery van's brake sensors fail. The onboard AI must decide whether to steer into a brick wall (harming the passenger) or stay on course (endangering pedestrians). Who holds legal liability under current UK law?",context:"Algorithmic ethics, manufacturer product liability, owner responsibility, and legislative gaps.",expectedKeywords:["Ethical dilemma / utilitarianism","Product liability (manufacturer vs software developer)","Owner maintenance liability","Insurance framework","Lack of clear autonomous agency in law"],scaffoldPrompt:"Can a computer algorithm or machine code be taken to court and sent to prison? If not, who is responsible?",stretchPrompt:"How does the UK Automated and Electric Vehicles Act 2018 allocate initial liability to insurers rather than human operators?",commonMisconception:"Attributing independent legal responsibility to the machine rather than the legal entities building or operating it.",bloomsLevel:"Evaluate"},{id:"pq18",topic:"Algorithms & Logic",probeType:"Misconception Hunter",question:"A pupil states: 'Binary Search is always faster than Linear Search for any search problem.' Give two specific scenarios where Linear Search is actually preferable or necessary.",context:"Preconditions (sorted vs unsorted), small dataset overhead, and single-item searches.",expectedKeywords:["Unsorted dataset (sorting first takes O(n log n))","Small datasets (overhead of midpoint calculation)","Item is at index 0 (Linear takes 1 step)","Streaming data / linked structures"],scaffoldPrompt:"What must you do to an unsorted array before you can run a binary search, and how much time does that preparation take?",stretchPrompt:"At what approximate array size N does the cost of sorting plus binary search break even against doing multiple linear searches?",commonMisconception:"Ignoring algorithm preconditions and the computational cost of sorting unsorted data.",bloomsLevel:"Evaluate"},{id:"pq19",topic:"Algorithms & Logic",probeType:"Mechanism Deep-Dive",question:"Explain why Merge Sort requires more auxiliary RAM than Bubble Sort, despite having a far superior worst-case time complexity O(n log n).",context:"In-place vs out-of-place sorting, recursive sub-lists, and auxiliary array allocation.",expectedKeywords:["Divide and conquer","Sub-arrays created in memory","Auxiliary space complexity O(n)","Bubble sort is in-place (O(1) extra space)","Memory overhead on constrained devices"],scaffoldPrompt:"When Merge Sort splits arrays into smaller lists and creates temporary merged lists, where are those numbers stored while merging?",stretchPrompt:"In what hardware environment (e.g. low-RAM microcontrollers) might an in-place sort like Insertion Sort be preferred over Merge Sort?",commonMisconception:"Assuming faster algorithms always consume fewer system resources across the board.",bloomsLevel:"Analyze"},{id:"pq20",topic:"Algorithms & Logic",probeType:"Code & Trace Challenge",question:"Trace this logic expression: Q = NOT (A OR (B AND C)). If A = 0, B = 1, an mmers work on different functions in the same program, what happens if they all use a global variable called 'x'?",stretchPrompt:"Explain how subprogram call stacks handle local variable frames and recursion.",commonMisconception:"Thinking global variables are superior because they are convenient to access from anywhere.",bloomsLevel:"Evaluate"},{id:"pq23",topic:"Programming Fundamentals",probeType:"Code & Trace Challenge",question:"A program has the following loop: `for i in range(1, 10, 2): print(i)`. How many values print, and what is the exact output? Why doesn't 10 print?",context:"Loop boundaries, step parameters, and non-inclusive upper bounds in programming languages.",expectedKeywords:["Prints: 1, 3, 5, 7, 9","5 numbers total","Step of 2","Upper bound 10 is exclusive (stops before 10)"],scaffoldPrompt:"What is the start number? Add 2 each time. Does range(start, stop) include the stop value?",stretchPrompt:"How would you rewrite this loop as a pre-condition WHILE loop with identical output?",commonMisconception:"Expecting the loop stop parameter to be inclusive.",bloomsLevel:"Apply"},{id:"pq24",topic:"Programming Fundamentals",probeType:"What If...? Boundary",question:"What is the difference between a Syntax Error, a Runtime Error, and a Logic Error? If an ATM dispenses £50 when you request £20, which error type has occurred?",context:"Error classification, compiler checking, execution crashes, and algorithmic flaws.",expectedKeywords:["Logic error","Syntax breaks grammatical rules (prevents compilation)","Runtime causes crash during execution (e.g. division by zero)","Logic runs fine but gives incorrect result","ATM logic defect in dispensing algorithm"],scaffoldPrompt:"Did the ATM computer crash? Did the code fail to compile? Or did it run and produce the wrong real-world calculation?",stretchPrompt:"How do automated unit tests and boundary test cases help detect logic errors before deployment?",commonMisconception:"Classifying all program mistakes as 'syntax errors'.",bloomsLevel:"Analyze"},{id:"pq25",topic:"Data Representation",probeType:"Misconception Hunter",question:"A student calculates: 'If an image has a color depth of 8 bits, it can represent 8 different colors.' What is the correct formula, and how many colors can 8 bits actually represent?",context:"Binary permutations and color depth formula 2^n.",expectedKeywords:["Formula is 2^n","2^8 = 256 unique colors","Each bit doubles combinations","00000000 through 11111111"],scaffoldPrompt:"How many numbers can you represent with 1 bit? 2 bits? 3 bits? Notice the pattern: 2, 4, 8...",stretchPrompt:"If we increase color depth from 8 bits to 24 bits (True Color), by what factor does the uncompressed file size increase?",commonMisconception:"Multiplying bit depth by 1 instead of calculating powers of 2.",bloomsLevel:"Apply"},{id:"pq26",topic:"Data Representation",probeType:"Mechanism Deep-Dive",question:"How does analog sound (continuous air vibrations) get converted into digital binary sound on a smartphone? What happens to sound quality and file size when the sample rate increases?",context:"Sampling rate, sample resolution (bit depth), ADC (analog-to-digital converter), and Nyquist-Shannon sampling.",expectedKeywords:["ADC (Analog to Digital Converter)","Sampling amplitude at regular intervals","Sample rate (Hz / samples per sec)","Bit depth (resolution per sample)","Higher rate = higher fidelity & larger file size"],scaffoldPrompt:"Can a computer store smooth continuous sound waves directly, or must it take numerical snapshots at set time intervals?",stretchPrompt:"Explain the Nyquist Theorem: why must human speech/music be sampled at at least 44,100 Hz (CD quality) to capture human hearing up to 20 kHz?",commonMisconception:"Believing digital files store actual analog audio waves rather than discrete numerical approximations.",bloomsLevel:"Analyze"},{id:"pq27",topic:"Data Representation",probeType:"Justify & Defend",question:"Why do computer scientists use Hex
