q",question:"Which internet protocol securely encrypts web pages using TLS/SSL over port 443?",options:["A) HTTP","B) FTP","C) HTTPS","D) SMTP"],correctOptionIndex:2,answer:"C - HTTPS",explanation:"HTTPS encrypts plaintext payloads to protect passwords and card transactions in transit.",misconceptionAlert:"Students forget that standard HTTP sends passwords across public networks unencrypted.",suggestedTimeSeconds:15,topic:"Protocols"},{id:"net-q2",type:"short_answer",question:"What permanent 48-bit hexadecimal identifier is burnt directly into a device's Network Interface Card (NIC)?",answer:"MAC Address (Media Access Control)",explanation:"A MAC address is fixed to the physical hardware chip, whereas an IP address is logical and routable.",misconceptionAlert:"Students confuse physical MAC addresses with dynamic IP addresses.",suggestedTimeSeconds:20,topic:"Network Hardware"},{id:"net-q3",type:"true_false",question:"TRUE or FALSE: In a Star network topology, if the central network switch fails, the remaining computers can still talk to one another.",options:["A) True","B) False"],correctOptionIndex:1,answer:"FALSE",explanation:"All traffic in a star topology routes through the central switch; if it dies, the whole network stops.",misconceptionAlert:"Students confuse a single client cable snapping with the central switch failing.",suggestedTimeSeconds:15,topic:"Network Topologies"},{id:"net-q4",type:"mcq",question:"What is the primary role of the Domain Name System (DNS)?",options:["A) Allocate private IP addresses via DHCP","B) Translate human-readable web domain names into numeric IP addresses","C) Compress streaming video files","D) Block external denial of service attacks"],correctOptionIndex:1,answer:"B - Translate human web domain names into IP addresses",explanation:"DNS servers look up domain names like bbc.co.uk and return the server's numerical IP address.",misconceptionAlert:"Students mistake DNS for web hosting or search engines like Google.",suggestedTim
