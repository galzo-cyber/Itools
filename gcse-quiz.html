<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR GCSE Computer Science (J277) Revision Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
<script src="/_aistudio-iframe.js?v=29045eb3"></script></head>
<body class="bg-[#0b1220] text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <header class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-extrabold text-xl">
          OCR
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl md:text-2xl font-black tracking-tight text-white">GCSE Computer Science J277</h1>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Official Spec</span>
          </div>
          <p class="text-xs text-slate-400 mt-1">
            Paper 1: Computer Systems &bull; Paper 2: Computational Thinking, Algorithms and Programming
          </p>
        </div>
      </div>
      <div class="flex items-center gap-3 text-xs font-mono">
        <span class="bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 text-slate-300">
          Score: <strong id="scoreDisplay" class="text-emerald-400">0</strong> / <span id="totalDisplay">0</span>
        </span>
        <button onclick="resetQuiz()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 font-semibold transition-colors">
          Reset
        </button>
      </div>
    </header>

    <!-- Filter Bar -->
    <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 border border-slate-800 p-3 rounded-xl">
      <div class="flex items-center gap-2">
        <label class="text-xs font-mono text-slate-400">Filter Topic:</label>
        <select id="topicFilter" onchange="filterQuestions()" class="bg-slate-950 border border-slate-800 text-xs font-bold text-slate-200 px-3 py-1.5 rounded-lg outline-none cursor-pointer">
          <option value="All">All Topics (Paper 1 & Paper 2)</option>
          <option value="Paper 1">Paper 1 Only (Systems Architecture, Memory, Networks, Security, Software)</option>
          <option value="Paper 2">Paper 2 Only (Algorithms, Programming, Robust Programs, Logic)</option>
        </select>
      </div>
      <div id="qCounter" class="text-xs font-mono text-slate-400">
        Question 1 of 12
      </div>
    </div>

    <!-- Quiz Card -->
    <main id="quizCard" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <span id="badgePaper" class="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Paper 1</span>
          <span id="badgeUnit" class="text-xs text-slate-400 font-medium">1.1 Systems Architecture</span>
        </div>
        <span id="badgeSpec" class="text-[11px] font-mono text-slate-500">Spec 1.1.1</span>
      </div>

      <h2 id="questionText" class="text-lg sm:text-xl font-bold text-white leading-relaxed">
        Loading question...
      </h2>

      <div id="optionsContainer" class="space-y-3">
        <!-- Options rendered dynamically -->
      </div>

      <div id="explanationBox" class="hidden rounded-xl border p-4 bg-slate-950 border-slate-800 space-y-2">
        <div class="flex items-center justify-between">
          <span id="resultHeading" class="text-xs font-mono font-bold">Result</span>
          <span class="text-[11px] font-mono text-slate-500">OCR Examiner Mark Scheme</span>
        </div>
        <p id="explanationText" class="text-xs text-slate-300 leading-relaxed"></p>
      </div>

      <div class="flex items-center justify-between pt-4 border-t border-slate-800">
        <button onclick="prevQuestion()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-300 transition-colors">
          &larr; Previous
        </button>
        <button id="nextBtn" onclick="nextQuestion()" class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl text-xs font-bold transition-all shadow-md">
          Next Question &rarr;
        </button>
      </div>
    </main>
  </div>

  <script>
    const questions = [
      {
        paper: "Paper 1",
        unit: "1.1 Systems Architecture",
        spec: "1.1.1",
        q: "Which CPU register holds the memory address of the NEXT instruction to be fetched from RAM?",
        options: ["Memory Data Register (MDR)", "Program Counter (PC)", "Accumulator (ACC)", "Current Instruction Register (CIR)"],
        correct: 1,
        exp: "The Program Counter (PC) stores the memory address of the next instruction. At the start of the fetch cycle, this address is copied to the MAR, and the PC is incremented."
      },
      {
        paper: "Paper 1",
        unit: "1.1 Systems Architecture",
        spec: "1.1.1",
        q: "Where is the data or instruction copied immediately after being fetched from main memory during the F-D-E cycle?",
        options: ["Memory Address Register (MAR)", "Arithmetic Logic Unit (ALU)", "Memory Data Register (MDR)", "Program Counter (PC)"],
        correct: 2,
        exp: "The instruction or data fetched from RAM is placed into the Memory Data Register (MDR) before being decoded."
      },
      {
        paper: "Paper 1",
        unit: "1.2 Memory and Storage",
        spec: "1.2.1",
        q: "What is the primary difference between RAM and ROM?",
        options: [
          "RAM is non-volatile; ROM is volatile",
          "RAM is volatile (loses data on power down); ROM is non-volatile (permanent)",
          "RAM stores the BIOS; ROM holds running programs",
          "RAM is optical storage; ROM is magnetic storage"
        ],
        correct: 1,
        exp: "RAM is volatile primary storage holding open applications. ROM is non-volatile and holds the bootstrap loader/BIOS."
      },
      {
        paper: "Paper 1",
        unit: "1.2 Memory and Storage",
        spec: "1.2.2",
        q: "Why is Solid State storage (SSD) preferred over Magnetic hard drives (HDD) in portable devices?",
        options: [
          "SSDs have moving parts that absorb drops better",
          "SSDs have no moving mechanical parts, providing durability, silent operation, and high shock resistance",
          "SSDs are cheaper per gigabyte than HDDs",
          "SSDs use laser beams to burn pits onto reflective plastic"
        ],
        correct: 1,
        exp: "Solid-state storage uses flash memory with zero moving parts, making it durable against shocks and drops, lightweight, and fast."
      },
      {
        paper: "Paper 1",
        unit: "1.2 Memory and Storage",
        spec: "1.2.4",
        q: "Perform a logical binary shift LEFT by 2 places on 00010100 (20 denary). What is the new value?",
        options: ["00000101 (5)", "01010000 (80)", "00101000 (40)", "10100000 (160)"],
        correct: 1,
        exp: "A left shift by 1 bit multiplies by 2. Shifting left by 2 bits multiplies by 4 (20 * 4 = 80). 00010100 shifted left 2 places is 01010000."
      },
      {
        paper: "Paper 1",
        unit: "1.3 Networks and Protocols",
        spec: "1.3.1",
        q: "In a Star network topology, what happens if the central switch fails?",
        options: [
          "Only Wi-Fi devices lose connection",
          "The entire network fails because all communications pass through the central node",
          "Packets automatically route through peer devices",
          "Only one workstation stops working"
        ],
        correct: 1,
        exp: "In a star topology, all devices connect directly to a central switch. If the central switch fails, all connected devices lose communication."
      },
      {
        paper: "Paper 1",
        unit: "1.4 Network Security",
        spec: "1.4.1",
        q: "What is SQL Injection?",
        options: [
          "Flooding a web server with millions of fake pings",
          "Entering malicious SQL commands into an input field to be executed by the database",
          "Sniffing packets across an open Wi-Fi network",
          "Guessing password hashes using dictionaries"
        ],
        correct: 1,
        exp: "SQL injection occurs when unsanitised input is entered into a form and executed by the backend database, potentially exposing or modifying private tables."
      },
      {
        paper: "Paper 1",
        unit: "1.6 Ethical and Legal",
        spec: "1.6.1",
        q: "Which UK law outlaws unauthorised access to computer material and spreading malware?",
        options: [
          "Data Protection Act 2018",
          "Computer Misuse Act 1990",
          "Copyright, Designs and Patents Act 1988",
          "Freedom of Information Act"
        ],
        correct: 1,
        exp: "The Computer Misuse Act 1990 makes hacking, unauthorised access, and creating/spreading malware illegal in the UK."
      },
      {
        paper: "Paper 2",
        unit: "2.1 Algorithms",
        spec: "2.1.2",
        q: "Why can a Binary Search NOT be performed on the list: [19, 4, 88, 12, 3]?",
        options: [
          "The list has an odd number of elements",
          "The list is not sorted into ascending order",
          "Binary search only works on strings",
          "The list must have at least 50 elements"
        ],
        correct: 1,
        exp: "Binary search repeatedly compares target to the midpoint and discards half. This requires the array to be in sorted order beforehand."
      },
      {
        paper: "Paper 2",
        unit: "2.1 Algorithms",
        spec: "2.1.2",
        q: "Which sorting algorithm repeatedly compares adjacent elements and swaps them if they are in the wrong order?",
        options: ["Merge Sort", "Bubble Sort", "Linear Sort", "Insertion Sort"],
        correct: 1,
        exp: "Bubble sort steps through the list comparing adjacent items, swapping them if needed. In each pass the largest unsorted element bubbles to the end."
      },
      {
        paper: "Paper 2",
        unit: "2.2 Programming Fundamentals",
        spec: "2.2.1",
        q: "What is the evaluated result of the expression: 19 MOD 4?",
        options: ["4", "3", "4.75", "76"],
        correct: 1,
        exp: "MOD (modulo) yields the remainder after integer division. 19 / 4 = 4 remainder 3, so 19 MOD 4 = 3."
      },
      {
        paper: "Paper 2",
        unit: "2.4 Boolean Logic",
        spec: "2.4.1",
        q: "Given A = 1 and B = 0, what is the output of: NOT (A AND B)?",
        options: ["0", "1", "Undefined", "2"],
        correct: 1,
        exp: "A AND B = 1 AND 0 = 0. NOT(0) evaluates to 1."
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let answeredCount = 0;
    let answered = false;
    let selectedOpt = null;
    let activeList = [...questions];

    function filterQuestions() {
      const val = document.getElementById('topicFilter').value;
      if (val === "All") {
        activeList = [...questions];
      } else {
        activeList = questions.filter(q => q.paper === val);
      }
      currentIdx = 0;
      answered = false;
      selectedOpt = null;
      renderQuestion();
    }

    function renderQuestion() {
      const q = activeList[currentIdx];
      document.getElementById('qCounter').innerText = `Question ${currentIdx + 1} of ${activeList.length}`;
      document.getElementById('badgePaper').innerText = q.paper;
      document.getElementById('badgeUnit').innerText = q.unit;
      document.getElementById('badgeSpec').innerText = `Spec ${q.spec}`;
      document.getElementById('questionText').innerText = q.q;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-4 rounded-xl border text-xs sm:text-sm transition-all flex items-center justify-between gap-3 cursor-pointer ${
          answered
            ? idx === q.correct
              ? 'bg-emerald-950 border-emerald-500 text-emerald-200 font-bold'
              : idx === selectedOpt
                ? 'bg-rose-950 border-rose-500 text-rose-300 line-through'
                : 'bg-slate-900 border-slate-800 text-slate-500 opacity-60'
            : 'bg-slate-800/80 hover:bg-slate-800 border-slate-700 text-slate-200'
        }`;

        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-lg bg-slate-900 border border-slate-700 flex items-center justify-center font-mono font-bold text-xs text-slate-300">
              ${String.fromCharCode(65 + idx)}
            </span>
            <span>${opt}</span>
          </div>
          ${answered ? (idx === q.correct ? '<span class="text-emerald-400 font-bold">&check;</span>' : idx === selectedOpt ? '<span class="text-rose-400 font-bold">&times;</span>' : '') : ''}
        `;

        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });

      const expBox = document.getElementById('explanationBox');
      if (answered) {
        expBox.classList.remove('hidden');
        document.getElementById('resultHeading').innerHTML = selectedOpt === q.correct
          ? '<span class="text-emerald-400">&check; Correct (+1 Mark)</span>'
          : '<span class="text-rose-400">&times; Incorrect (0 Marks)</span>';
        document.getElementById('explanationText').innerText = q.exp;
      } else {
        expBox.classList.add('hidden');
      }

      document.getElementById('scoreDisplay').innerText = score;
      document.getElementById('totalDisplay').innerText = answeredCount;
    }

    function selectOption(idx) {
      if (answered) return;
      answered = true;
      selectedOpt = idx;
      answeredCount++;
      const q = activeList[currentIdx];
      if (idx === q.correct) {
        score++;
      }
      renderQuestion();
    }

    function nextQuestion() {
      if (currentIdx < activeList.length - 1) {
        currentIdx++;
        answered = false;
        selectedOpt = null;
        renderQuestion();
      } else {
        alert(`Quiz Finished! Your Score: ${score} out of ${answeredCount} (${Math.round((score/answeredCount)*100)}%)`);
      }
    }

    function prevQuestion() {
      if (currentIdx > 0) {
        currentIdx--;
        answered = false;
        selectedOpt = null;
        renderQuestion();
      }
    }

    function resetQuiz() {
      currentIdx = 0;
      score = 0;
      answeredCount = 0;
      answered = false;
      selectedOpt = null;
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
