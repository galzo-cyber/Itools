tations for non-moving products like posters, web pages, or game covers.",ocrSpecRef:"R093 Topic Area 3 (TA3.2)",difficulty:"Pass"},{id:"im-q3",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Pre-Production Documents",question:"Which of the following items MUST be included in a professional Storyboard for a television advertisement?",options:["Scene sketches, camera shot types (e.g., Close-Up), camera movement, dialogue, and timings","Gantt chart deadlines, worker hourly pay rates, and software license keys","CSS code styling, database schemas, and website wireframes","Fabric swatches, texture samples, and physical paint chips"],correctIndex:0,explanation:"A Storyboard breaks down dynamic or moving sequences shot-by-shot, including visual panel sketches, shot types (Close-up, Wide), camera angles/movements (pan, tilt), dialogue/sound effects, and frame duration.",ocrSpecRef:"R093 Topic Area 3 (TA3.3)",difficulty:"Merit"},{id:"im-q4",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Pre-Production Documents",question:"In a professional media production script, what is the standard term used to denote whether a scene takes place indoors or outdoors and at what time of day (e.g., INT. TECH LAB - NIGHT)?",options:["Slugline (Scene Heading)","Dialogue Cue","Parenthetical","Action Call"],correctIndex:0,explanation:"The Slugline or Scene Heading specifies location (INT for interior, EXT for exterior), specific setting name, and lighting/time (DAY, NIGHT, DUSK).",ocrSpecRef:"R093 Topic Area 3 (TA3.4)",difficulty:"Merit"},{id:"im-q5",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Target Audience & Client Brief",question:"Which of the following describes psychographic segmentation when defining a target audience for a video game?",options:["Categorising users by age (16-24), gender, and geographic town","Categorising users by lifestyle, core personal values, hobbies, and leisure interests","Categorising users by household income bracket and employment grade (A, B, C1)","Categorising users by monitor screen resolution and broadband download speed"],correctIndex:1,explanation:"Psychographics focus on psychological traits: personal beliefs, hobbies, gaming preferences, attitudes, and lifestyle choices, whereas demographics measure age, gender, and income.",ocrSpecRef:"R093 Topic Area 2 (TA2.2)",difficulty:"Merit"},{id:"im-q6",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Legal & Regulatory Constraints",question:"Under the Copyright, Designs and Patents Act 1988, what must a media producer do before using a commercially recorded pop song in their YouTube advert?",options:["Simply state 'No copyright infringement intended' in the video description","Change the pitch of the song by 5% and use less than 10 seconds of it","Obtain explicit written permission or a synchronisation/commercial license from the copyright owner","Acknowledge the singer's name in the end credits without needing permission"],correctIndex:2,explanation:"Under the Copyright, Designs and Patents Act 1988, using proprietary music commercially requires express written permission or an agreed synchronization license from the copyright holder. Fair dealing or disclaimers do not grant commercial exemption.",ocrSpecRef:"R093 Topic Area 2 (TA2.3)",difficulty:"Distinction"},{id:"im-q7",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Legal & Regulatory Constraints",question:"What is the difference between Libel and Slander under UK defamation law?",options:["Libel applies to printed or permanent published defamation; Slander applies to spoken, temporary remarks","Libel applies only to politicians; Slander applies to private citizens","Libel is a criminal offence punishable by prison; Slander is merely a school rule","Libel applies to photographs; Slander applies only to background sound effects"],correctIndex:0,explanation:"Defamation damages a person's or organisation's reputation. Libel is in permanent/published form (print, websites, broadcast), whereas Slander is temporary/transient (spoken spoken words or gestures).",ocrSpecRef:"R093 Topic Area 2 (TA2.3)",difficulty:"Merit"},{id:"im-q8",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Regulatory Bodies",question:"Which organisation is legally responsible for classifying video games in the UK and Europe using age ratings and content symbols?",options:["BBFC (British Board of Film Classification)","PEGI (Pan-European Game Information)","ASA (Advertising Standards Authority)","OFCOM (Office of Communications)"],correctIndex:1,explanation:"PEGI classifies video games with age badges (3, 7, 12, 16, 18) and content descriptor icons (violence, bad language, fear, gambling). The BBFC classifies films, theatrical releases, and DVDs.",ocrSpecRef:"R093 Topic Area 2 (TA2.3)",difficulty:"Pass"},{id:"im-q9",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Workplanning & Production Management",question:"In project management, why is 'contingency time' included on a Gantt chart?",options:["To ensure staff can take extended holidays during the project","To provide buffer time for unexpected delays like equipment failure, illness, or revisions","To trick the client into paying for more working hours than needed","To reserve time for deleting old hard drive backups"],correctIndex:1,explanation:"Contingency planning accounts for unforeseen risks—such as camera breakdowns, adverse weather during location shoots, client change requests, or personnel sickness—preventing missed delivery milestones.",ocrSpecRef:"R093 Topic Area 3 (TA3.5)",difficulty:"Pass"},{id:"im-q10",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Health & Safety",question:"When conducting a risk assessment for an outdoor location video shoot, what must be documented for each identified hazard?",options:["The hazard, who might be harmed, the likelihood/severity of harm, and control measures to minimise the risk","The cost of the camera equipment and the brand name of the microphones","The actors' personal email addresses and social media handles","The vehicle fuel efficiency of the production van"],correctIndex:0,explanation:"A Risk Assessment identifies potential hazards (e.g. trailing cables, deep water, traffic), specifies who could be harmed, evaluates risk level (likelihood x severity), and institutes control measures (cable tape, hi-vis vests, safety barriers).",ocrSpecRef:"R093 Topic Area 3 (TA3.6)",difficulty:"Pass"},{id:"im-q11",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Visual Identity Elements",question:"What is the key purpose of a corporate Visual Identity Style Guide for a brand?",options:["To list all employee monthly salaries and bank details","To ensure visual consistency across all branding by defining logo rules, colour codes (HEX/CMYK), typography, and clear zones","To compile a storyboard of the company's past TV advertisements","To calculate the annual profit margin of physical merchandise"],correctIndex:1,explanation:"A brand style guide enforces brand consistency across print, digital, and apparel by regulating logo minimum sizes, exclusion zones, approved colour palettes (RGB, CMYK, Pantone), and acceptable typefaces.",ocrSpecRef:"R094 Topic Area 1 (TA1.1)",difficulty:"Pass"},{id:"im-q12",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Typography",question:"What differentiates a 'Serif' font from a 'Sans-Serif' font in graphic design?",options:["Serif fonts have decorative projections/feet at the ends of letter strokes; Sans-Serif fonts have clean, plain stroke terminals","Serif fonts can only be printed in black; Sans-Serif fonts can be full colour","Serif fonts are always pixelated; Sans-Serif fonts are always vector shapes","Serif fonts cannot be used on websites under W3C accessibility guidelines"],correctIndex:0,explanation:"Serifs are the small projecting features or 'feet' at the ends of strokes (e.g. Times New Roman, Georgia), conveying tradition and prestige. Sans-Serif (French for 'without') has clean, unadorned ends (e.g. Arial, Helvetica), popular for modern digital displays.",ocrSpecRef:"R094 Topic Area 1 (TA1.2)",difficulty:"Pass"},{id:"im-q13",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Technical Graphic Properties",question:"Why would a graphic designer create a company logo as a Vector graphic (e.g. SVG / EPS) rather than a Raster / Bitmap graphic (e.g. JPEG)?",options:["Vector graphics use mathematical paths that scale infinitely without pixelation or quality loss","Vector graphics support millions more colours than raster images","Vector files cannot be opened on mobile devices, making them more secure","Vector graphics automatically compress photographs with higher fidelity than PNG"],correctIndex:0,explanation:"Vector graphics are built from mathematical equations (points, lines, curves, shapes), allowing infinite scaling from a tiny business card to a billboard with no pixelation. Raster images are grids of pixels that pixelate when enlarged.",ocrSpecRef:"R094 Topic Area 2 (TA2.1)",difficulty:"Merit"},{id:"im-q14",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Colour Systems",question:"Which colour mode must be selected when preparing a graphic asset for commercial four-colour lithographic printing?",options:["RGB (Red, Green, Blue)","CMYK (Cyan, Magenta, Yellow, Key/Black)","Grayscale 8-bit","Indexed 256 Color"],correctIndex:1,explanation:"CMYK is a subtractive colour model used for physical printing inks (Cyan, Magenta, Yellow, Black). RGB is an additive colour model used exclusively for illuminated light screens (monitors, phones, TVs).",ocrSpecRef:"R094 Topic Area 2 (TA2.2)",difficulty:"Merit"},{id:"im-q15",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"File Formats & Compression",question:"Which file format supports true 24-bit colour AND an 8-bit alpha channel for transparent backgrounds on websites?",options:["JPEG (.jpg)","PNG (.png)","GIF (.gif)","BMP (.bmp)"],correctIndex:1,explanation:"PNG-24 supports full RGB colour with an 8-bit alpha channel allowing variable levels of transparency and semi-transparency. JPEGs do not support transparency, and GIFs only support 1-bit binary on/off transparency with 256 colours.",ocrSpecRef:"R094 Topic Area 2 (TA2.3)",difficulty:"Merit"},{id:"im-q16",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Editing Techniques",question:"In graphics editing software, what is the primary advantage of using Layer Masks rather than the Eraser Tool?",options:["Layer masks enable non-destructive editing; hidden pixels can easily be restored by painting with white","Layer masks automatically reduce the file size on the hard drive by 50%","Layer masks convert bitmap pixels into vector bezier curves","Layer masks bypass all copyright licensing restrictions"],correctIndex:0,explanation:"Layer masking is non-destructive: black conceals parts of the layer and white reveals them. The original image data is never destroyed, unlike the Eraser Tool which permanently deletes pixel data.",ocrSpecRef:"R094 Topic Area 3 (TA3.2)",difficulty:"Distinction"},{id:"im-q17",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Colour Theory",question:"What are 'Complementary Colours' on the traditional colour wheel?",options:["Colours that sit directly adjacent to each other on the wheel (e.g. blue, blue-green)","Colours that sit directly opposite each other on the wheel (e.g. blue and orange, red and green)","Tints of the same single colour with varying white values","Colours that look identical when converted to black and white"],correctIndex:1,explanation:"Complementary colours sit directly opposite each other on the colour wheel (e.g. purple and yellow, blue and orange). When placed side by side, they create maximum contrast and visual vibrancy.",ocrSpecRef:"R094 Topic Area 1 (TA1.3)",difficulty:"Pass"},{id:"im-q18",unit:"R097",unitName:"R097: Interactive Digital Media",topicArea:"Navigation Structures",question:"Which navigation structure forces the user to progress through screens sequentially one after the other in a fixed, predetermined order?",options:["Hierarchical Structure","Linear Navigation Structure","Webbed (Mesh) Structure","Matrix Navigation Structure"],correctIndex:1,explanation:"A Linear navigation structure moves step-by-step from one screen directly to the next (e.g. an online checkout funnel, onboarding tutorial, or sequential slideshow).",ocrSpecRef:"R097 Topic Area 1 (TA1.2)",difficulty:"Pass"},{id:"im-q19",unit:"R097",unitName:"R097: Interactive Digital Media",topicArea:"UX & Accessibility",question:"Why is 'Alt Text' (alternative text) an essential accessibility requirement when designing interactive websites?",options:["It allows screen reader software to read out image descriptions to visually impaired users","It makes the web server load images twice as fast over 4G connections","It allows users to download original raw image files without watermarks","It automatically translates text into foreign languages"],correctIndex:0,explanation:"Alt text provides a descriptive text equivalent for non-text content, ensuring visually impaired users utilizing screen readers understand the purpose and content of the imagery.",ocrSpecRef:"R097 Topic Area 1 (TA1.4)",difficulty:"Pass"},{id:"im-q20",unit:"R097",unitName:"R097: Interactive Digital Media",topicArea:"Interactive Components",question:"What is a 'rollover' or 'hover state' in interactive multimedia design?",options:["An automated sound file that plays when the user closes their web browser tab","A visual alteration (colour change, scale, glow) triggered when the user's cursor hovers over an interactive element","A method of saving files automatically when hard drive storage is nearly full","A technique used in storyboards to indicate a 360-degree camera roll"],correctIndex:1,explanation:"Rollover/hover states provide instant visual feedback to the user, confirming that an icon, button, or link is interactive and clickable.",ocrSpecRef:"R097 Topic Area 2 (TA2.3)",difficulty:"Pass"},{id:"im-q21",unit:"R097",unitName:"R097: Interactive Digital Media",topicArea:"Testing & Usability Review",question:"Which type of testing verifies that an interactive website displays and functions correctly across Chrome, Safari, Edge, Firefox, and mobile screens?",options:["A/B Split Testing","Cross-Platform & Cross-Browser Compatibility Testing","Stress & Load Testing","Penetration Security Testing"],correctIndex:1,explanation:"Cross-platform and cross-browser testing verifies that responsive stylesheets, navigation menus, video embeds, and scripts render correctly across diverse operating systems and web engines.",ocrSpecRef:"R097 Topic Area 3 (TA3.1)",difficulty:"Merit"},{id:"im-q22",unit:"R097",unitName:"R097: Interactive Digital Media",topicArea:"Pre-Production for Interactive Media",question:"What is the difference between a Site Map and a Wireframe?",options:["A Site Map shows the overall structural hierarchy between pages; a Wireframe shows the layout and UI elements of an individual page","A Site Map is a physical geographic map; a Wireframe is a high-voltage electrical cable plan","A Site Map contains the audio dialogue; a Wireframe contains the camera shot angles","A Site Map is created after launch; a Wireframe is created before client approval"],correctIndex:0,explanation:"A Site Map represents the architecture, hierarchy, and linking relationship between pages of an interactive media product. A Wireframe maps out the spatial layout of UI components on an individual page.",ocrSpecRef:"R097 Topic Area 1 (TA1.1)",difficulty:"Merit"}],CN=[{id:"fc-1",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Pre-Production",term:"Mood Board",definition:"A visual collage of sample images, textures, materials, and colours used to capture the overall aesthetic feel, atmosphere, or style for a creative project.",keyFact:"Focuses on feeling and style, NOT layout or spatial positioning.",specCode:"TA3.1"},{id:"fc-2",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Pre-Production",term:"Mind Map (Spidergram)",definition:"A visual diagram radiating outward from a central theme or node with sub-branches to brainstorm, organise, and connect creative ideas.",keyFact:"Must include a central node, main branches, sub-branches, and keywords or mini-images.",specCode:"TA3.1"},{id:"fc-3",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Pre-Production",term:"Visualisation Diagram",definition:"A hand-drawn or digital static mock-up of a planned still product showing layout, proportions, text placement, assets, and annotations.",keyFact:"Used for static products like magazine covers, posters, website pages, and game packaging.",specCode:"TA3.2"},{id:"fc-4",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Pre-Production",term:"Storyboard",definition:"A sequential series of visual frames illustrating a moving media product with shot types, camera angles, movement, sound/dialogue, and timings.",keyFact:"Essential for animations, television adverts, films, and video games.",specCode:"TA3.3"},{id:"fc-5",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Pre-Production",term:"Script",definition:"A written document detailing scene locations (sluglines), characters, dialogue, actions, sound effects, and directions for actors and crew.",keyFact:"Uses INT/EXT headings, centered character names, and parenthetical directions.",specCode:"TA3.4"},{id:"fc-6",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Legal",term:"Copyright Act 1988",definition:"UK legislation protecting original literary, dramatic, musical, and artistic works from unauthorised copying, distribution, or adaptation.",keyFact:"Applies automatically upon creation in tangible form; requires permissions/licences to use commercially.",specCode:"TA2.3"},{id:"fc-7",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Legal",term:"Creative Commons",definition:"A public copyright licensing system that allows creators to grant permission for others to use and share their work under specified conditions.",keyFact:"Common tags: BY (Attribution), NC (Non-Commercial), SA (Share-Alike), ND (No Derivatives).",specCode:"TA2.3"},{id:"fc-8",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Legal",term:"Trademark",definition:"A registered sign, symbol, slogan, or logo that distinguishes the goods or services of one organisation from another in trade.",keyFact:"Prevents consumer confusion; marked with ™ (unregistered) or ® (registered).",specCode:"TA2.3"},{id:"fc-9",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Regulation",term:"BBFC & PEGI",definition:"BBFC classifies age suitability for films and videos in the UK (U, PG, 12A, 15, 18). PEGI classifies age ratings and content warnings for video games in Europe.",keyFact:"PEGI uses 3, 7, 12, 16, 18 plus content descriptors like violence, fear, and bad language.",specCode:"TA2.3"},{id:"fc-10",unit:"R093",unitName:"R093: Media Industry & Workplanning",topicArea:"Planning",term:"Gantt Chart",definition:"A horizontal bar chart showing project schedule, task breakdown, start and end dates, milestones, and contingency buffer time.",keyFact:"Visualises dependencies (tasks that cannot start until prior tasks complete).",specCode:"TA3.5"},{id:"fc-11",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Visual Identity",term:"Brand Style Guide",definition:"A formal set of design specifications establishing rules for logo placement, exclusion zones, colour palettes, typefaces, and minimum sizing.",keyFact:"Ensures complete visual consistency across both print and digital touchpoints.",specCode:"TA1.1"},{id:"fc-12",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Technical",term:"Vector Graphic",definition:"A graphic composed of mathematical paths, curves, and coordinates rather than individual coloured pixels.",keyFact:"Scales infinitely to any size without any pixelation or loss of crispness (e.g. SVG, AI, EPS).",specCode:"TA2.1"},{id:"fc-13",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Technical",term:"Raster (Bitmap) Graphic",definition:"A digital image composed of a rectangular grid of microscopic picture elements called pixels.",keyFact:"Loses sharpness and pixelates when enlarged beyond native resolution (e.g. JPEG, PNG).",specCode:"TA2.1"},{id:"fc-14",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Colour Systems",term:"RGB vs CMYK",definition:"RGB (Red Green Blue) is an additive colour model for illuminated screens. CMYK (Cyan Magenta Yellow Key/Black) is a subtractive model for print inks.",keyFact:"Printing an RGB image directly results in dull, shifted colours because ink cannot emit light.",specCode:"TA2.2"},{id:"fc-15",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Technical",term:"DPI vs PPI",definition:"DPI (Dots Per Inch) measures printer resolution; PPI (Pixels Per Inch) measures digital display and image sensor pixel density.",keyFact:"Standard web resolution is 72-96 PPI; high quality commercial print requires 300 DPI.",specCode:"TA2.2"},{id:"fc-16",unit:"R094",unitName:"R094: Visual Identity & Digital Graphics",topicArea:"Editing",term:"Non-Destructive Editing",definition:"A workflow where original pixel data is preserved intact through layers, adjustment layers, smart objects, and layer masks.",keyFact:"Changes can be reversed, re-edited, or tuned at any stage without degrading image quality.",specCode:"TA3.2"},{id:"fc-17",unit:"R097",unitName:"R097: Interactive Digital Media",topicArea:"Navigation",term:"Hierarchical Navigation",definition:"A tree-like structure where a top homepage branches down into primary categories and further into sub-pages.",keyFact:"The standard architecture for e-commerce, school websites, and large intranets.",specCode:"TA1.2"},{id:"fc-18",unit:"R097",unitName:"R097: Interactive Digital Media",topicArea:"Design",term:"Wireframe",definition:"A low-fidelity structural blueprint of a single page or screen showing placement of header, navigation, content blocks, and footer.",keyFact:"Focuses purely on content layout, user flow, and interaction, stripping out colours and fonts.",specCode:"TA1.1"},{id:"fc-19",unit:"R097",unitName:"R097: Interactive Digital Media",topicArea:"Accessibility",term:"Accessibility (WCAG)",definition:"Designing interactive media so users of all abilities, including those with visual, auditory, motor, or cognitive impairments, can navigate effectively.",keyFact:"Key requirements: Alt text, keyboard navigation, subtitles/captions, and minimum 4.5:1 text contrast ratio.",specCode:"TA1.4"},{id:"fc-20",unit:"R097",unitName:"R097: Interactive Digital Media",topicArea:"Testing",term:"User Acceptance Testing (UAT)",definition:"Testing interactive media with representative members of the target audience to verify that the product fulfills client requirements.",keyFact:"Gathers qualitative feedback on navigation intuitiveness, engagement, and usability flaws.",specCode:"TA3.1"}],Wd=[{id:"sc-1",unit:"R093",title:"Pre-Production Strategy: 'EcoVolt Electric Scooters' Promotional Campaign",scenario:"EcoVolt is launching a high-end electric commuter scooter aimed at urban young professionals aged 22–35. The marketing director has hired your media agency to produce a 60-second video advert for social media and a series of promotional digital posters.",question:"Discuss the suitability of using a Mood Board and a Visualisation Diagram during the pre-production phase of this project. Explain what content should be included on each document and how they benefit the client and production team.",totalMarks:8,guidance:["Define the specific purpose and role of both pre-production documents.","Detail the specific content elements required on the Mood Board (lifestyle imagery, eco-green tones, modern typography samples, sleek metal textures).","Detail the specific content elements on the Visualisation Diagram (poster dimensions, headline placement, scooter beauty shot, call-to-action, disclaimer text).","Explain how these documents prevent misunderstandings with the client and save time/money before costly production begins."],level1:"Level 1 (1–3 Marks): Identifies basic features of mood boards and visualisation diagrams with brief mention of images or colours. Weak link to the EcoVolt target audience or client communication.",level2:"Level 2 (4–6 Marks): Clear explanation of both documents with appropriate examples of content (colours, typography, layout) linked to the urban professional demographic. Explains how documents guide creation.",level3:"Level 3 (7–8 Marks): Comprehensive, well-structured discussion evaluating both documents. Clearly contrasts mood/feeling against static spatial layout. Directly references the 22-35 urban professional demographic and demonstrates how pre-production prevents wasted budget and ensures client sign-off.",modelAnswer:`A Mood Board is ideally suited at the concept stage to establish the overall visual aesthetic and tone. For EcoVolt, it should collate images of modern cityscapes, young professionals commuting in business-casual attire, minimalist urban architecture, and brushed aluminum textures. A colour palette dominated by electric cyan, forest emerald, and slate dark grey should be featured alongside modern sans-serif typography samples. This allows the client to confirm that the proposed branding aligns with their premium eco-friendly ethos before filming begins.

In contrast, a Visualisation Diagram is essential for the static promotional posters. It maps out the exact spatial composition: the positioning of the scooter hero image, the high-impact headline ('Charge Your Commute'), key performance statistics (range, speed), pricing, and regulatory helmet disclaimers. It specifies font sizing hierarchies and grid margins, ensuring the graphic artist produces a balanced, legally compliant poster that satisfies client requirements without costly revisions.`},{id:"sc-2",unit:"R093",title:"Legal & Regulatory Compliance: School Podcast & Video Broadcast",scenario:"Oakridge Academy's student media team is creating a weekly video podcast series to be uploaded to YouTube and Spotify. The show includes interviews, background pop music, video clips from recent Hollywood movies, and user comments from social media.",question:"Explain the legal and regulatory issues the media team must consider regarding Copyright, Defamation, and Age Ratings. Recommend actionable steps the team must take to ensure the podcast remains fully compliant with UK law.",totalMarks:8,guidance:["Explain the Copyright, Designs and Patents Act 1988 regarding third-party music and movie clips.","Explain Defamation (Libel and Slander) regarding comments made about teachers, students, or local businesses.","Discuss age classification regulations (BBFC / PEGI standards for language and content).","Recommend solutions: Creative Commons/Royalty-free music, editorial review, and moderation."],level1:"Level 1 (1–3 Marks): Basic identification that music cannot be copied without permission or that people shouldn't say mean things. Generic advice without naming legislation.",level2:"Level 2 (4–6 Marks): Explains copyright licenses, distinguishes defamation, and mentions age ratings. Recommends royalty-free music and editorial approval.",level3:"Level 3 (7–8 Marks): Detailed, fully justified response correctly citing the Copyright, Designs and Patents Act 1988, Libel vs Slander, and age suitability guidelines. Recommends sound practical workflows: using CC-BY royalty-free audio libraries, obtaining written release forms, and conducting peer reviews before publication.",modelAnswer:`The student team faces critical legal constraints under the Copyright, Designs and Patents Act 1988. Using commercial pop music or Hollywood movie clips without explicit synchronization licenses is copyright infringement, leading to YouTube copyright strikes, demonetization, or automated takedowns. The team should instead utilise Royalty-Free or Creative Commons (CC-BY) libraries (e.g. YouTube Audio Library) and ensure proper attribution.

Secondly, the team must avoid defamation. If an interview or comment contains false, derogatory claims damaging a student's or teacher's reputation, this constitutes Slander (spoken) and Libel once recorded and uploaded online. A formal pre-broadcast editorial review must be enforced, cutting unverified personal accusations.

Finally, the show must adhere to age classification standards. Given that this is a school podcast, content should be kept suitable for a Universal (U) or PG audience, avoiding profanity, adult themes, or graphic imagery to maintain community standards and avoid platform age restrictions.`}],R0=[{id:"sec-r093-preprod",unit:"R093",unitName:"R093: Media Industry & Workplanning",title:"Pre-Production Documents & Planning",bulletPoints:[{subtitle:"Mood Boards",details:["Purpose: To capture and communicate ideas, concepts, feelings, and aesthetic atmosphere for a new media product.","Contents: Sample images, fabrics, textures, colour palettes, typography samples, and brief descriptive annotations.","Golden Rule: Mood boards define visual feeling and tone; they do NOT show product layout or measurements."]},{subtitle:"Mind Maps (Spidergrams)",details:["Purpose: To brainstorm ideas, map thoughts logically, and develop links between concepts.","Contents: Central main node, primary branches (major themes), sub-branches (detailed ideas), connecting lines, keywords, and illustrative icons."]},{subtitle:"Visualisation Diagrams",details:["Purpose: To illustrate the planned static spatial layout, proportion, composition, and visual hierarchy of a single still product.","Contents: Dimensions, grid margins, font styles, colour codes, image placeholder blocks, logo positioning, and clear annotations."]},{subtitle:"Storyboards",details:["Purpose: To illustrate the chronological visual flow of moving or time-based media (film, animation, adverts).","Contents: Scene sketches, shot types (Close-Up, Wide), camera angles (High, Low, Eye-level), camera movements (Pan, Tilt, Zoom, Track), dialogue/voiceover, sound effects, lighting cues, and timings."]},{subtitle:"Scripts",details:["Purpose: To provide written instructions for performers and production crew detailing spoken dialogue, action, and setting.","Contents: Scene headings (Sluglines e.g. INT. CLASSROOM - DAY), character names in capitals, dialogue, parenthetical instructions, and sound/visual cues."]}],keyTerms:["Mood Board","Mind Map","Visualisation Diagram","Storyboard","Script","Slugline","Camera Shots"],commonMistakes:["Mistaking a mood board for a layout draft (a mood board should never look like a poster layout).","Forgetting camera movements or frame timings on storyboard panels.","Failing to annotate why design choices meet the client brief."]},{id:"sec-r093-legal",unit:"R093",unitName:"R093: Media Industry & Workplanning",title:"Legal, Ethical & Regulatory Frameworks",bulletPoints:[{subtitle:"Copyright, Designs & Patents Act 1988",details:["Protects original creative works (music, photos, code, illustrations, video).","Requires explicit written permission or purchase of commercial licences from the copyright owner.","Public Domain: Works where copyright has expired (usually 70 years after creator's death)."]},{subtitle:"Creative Commons Licences",details:["BY (Attribution): Must credit original author.","NC (Non-Commercial): Cannot be sold or used in commercial advertising.","ND (No Derivatives): Cannot alter, crop, or remix the work.","SA (Share Alike): Must release derivatives under identical licensing terms."]},{subtitle:"Regulatory Bodies",details:["BBFC: Classifies films and physical videos in the UK (U, PG, 12A, 12, 15, 18).","PEGI: Classifies video games with age ratings (3, 7, 12, 16, 18) and content icons (Violence, Bad Language, Fear, Sex, Drugs, Gambling, In-Game Purchases).","ASA: Regulates UK advertising ensuring ads are legal, decent, honest, and truthful.","OFCOM: Regulates television, radio, and telecommunications broadcasting."]},{subtitle:"Defamation Law",details:["Defamation: False statements that damage the reputation of an individual or organisation.","Libel: Permanent form of defamation (printed, recorded, published on social media).","Slander: Temporary, spoken form of defamation."]}],keyTerms:["Copyright 1988","Creative Commons","Trademarks","PEGI","BBFC","ASA
