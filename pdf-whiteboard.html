.",suggestedTimeSeconds:20,topic:"CPU Components"},{id:"cpu-q3",type:"true_false",question:"TRUE or FALSE: Increasing the CPU clock speed from 2.0 GHz to 4.0 GHz will always double the overall operating speed of all programs.",options:["A) True","B) False"],correctOptionIndex:1,answer:"FALSE",explanation:"Performance is also bottlenecked by RAM latency, disk I/O, cache misses, and thermal throttling.",misconceptionAlert:"Students assume CPU clock frequency directly equates to total real-world system throughput.",suggestedTimeSeconds:15,topic:"CPU Performance"},{id:"cpu-q4",type:"fill_blank",question:"Data in volatile primary memory (RAM) is completely _______ whenever computer power is disconnected.",answer:"Lost / Cleared / Erased",explanation:"RAM requires continuous electrical refresh; without current, capacitor charge drains immediately.",misconceptionAlert:"Students mix up volatile RAM with non-volatile ROM or magnetic storage.",suggestedTimeSeconds:15,topic:"Memory & Storage"},{id:"cpu-q5",type:"mcq",question:"What is the primary role of Cache memory located on or near the processor die?",options:["A) Provide permanent secondary backup of the operating system","B) Provide ultra-fast temporary storage for frequently used instructions to reduce RAM delay","C) Convert analog voltages into digital binary signals","D) Cool the processor during heavy algorithmic computation"],correctOptionIndex:1,answer:"B - Ultra-fast storage for frequently used instructions",explanation:"Cache operates at near-CPU speeds, avoiding the slow system bus trip to physical RAM.",misconceptionAlert:"Students confuse cache with virtual memory on the hard drive.",suggestedTimeSeconds:20,topic:"CPU Cache"}]},{id:"sample-net",name:"GCSE CS - Networks, Protocols & Cyber Threats.pdf",category:"GCSE CS (J277/01)",description:"Star vs Mesh topologies, IP vs MAC addresses, DNS, TCP/IP, and Social Engineering safeguards.",topic:"Computer Networks & Security",defaultQuestions:[{id:"net-q1",type:"mcq",question:"Which internet protocol securely encrypts web pages using TLS/SSL over port 443?",options:["A) HTTP","B) FTP","C) HTTPS","D) SMTP"],correctOptionIndex:2,answer:"C - HTTPS",explanation:"HTTPS encrypts plaintext payloads to protect passwords and card transactions in transit.",misconceptionAlert:"Students forget that standard HTTP sends passwords across public networks unencrypted.",suggestedTimeSeconds:15,topic:"Protocols"},{id:"net-q2",type:"short_answer",question:"What permanent 48-bit hexadecimal identifier is burnt directly into a device's Network Interface Card (NIC)?",answer:"MAC Address (Media Access Control)",explanation:"A MAC address is fixed to the physical hardware chip, whereas an IP address is logical and routable.",misconceptionAlert:"Students confuse physical MAC addresses with dynamic IP addresses.",suggestedTimeSeconds:20,topic:"Network Hardware"},{id:"net-q3",type:"true_false",question:"TRUE or FALSE: In a Star network topology, if the central network switch fails, the remaining computers can still talk to one another.",options:["A) True","B) False"],correctOptionIndex:1,answer:"FALSE",explanation:"All traffic in a star topology routes through the central switch; if it dies, the whole network stops.",misconceptionAlert:"Students confuse a single client cable snapping with the central switch failing.",suggestedTimeSeconds:15,topic:"Network Topologies"},{id:"net-q4",type:"mcq",question:"What is the primary role of the Domain Name System (DNS)?",options:["A) Allocate private IP addresses via DHCP","B) Translate human-readable web domain names into numeric IP addresses","C) Compress streaming video files","D) Block external denial of service attacks"],correctOptionIndex:1,answer:"B - Translate human web domain names into IP addresses",explanation:"DNS servers look up domain names like bbc.co.uk and return the server's numerical IP address.",misconceptionAlert:"Students mistake DNS for web hosting or search engines like Google.",suggestedTim
